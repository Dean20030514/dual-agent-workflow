schema_version: 1
role_id: game-dev
display_name: 游戏工程
capabilities: ["game-dev","simulation","player-loop","asset-integration"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","game/**","Assets/**","tests/**","docs/**"]
default_write_scope: ["src/**","game/**","Assets/**","tests/**","docs/**"]
verification:
  preferred: ["editmode","playmode","player-smoke"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["save_format_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Check state transitions, save compatibility, and repeated sessions; distinguish editor tests from Player and human acceptance."
