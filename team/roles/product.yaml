schema_version: 1
role_id: product
display_name: 产品需求
capabilities: ["product","acceptance-design","business-rules"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["docs/**","tests/**"]
default_write_scope: ["docs/**"]
verification:
  preferred: ["acceptance-review","consistency"]
subagents: {allowed: false, max_depth: 0}
critical_triggers: ["business_contract_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Define observable user outcomes and non-goals; escalate mutually exclusive business interpretations."
