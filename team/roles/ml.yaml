schema_version: 1
role_id: ml
display_name: 机器学习工程
capabilities: ["ml","evaluation","inference","model-integration"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","tests/**","docs/**"]
default_write_scope: ["src/**","tests/**","docs/**"]
verification:
  preferred: ["evaluation","regression","data-leakage"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["model_safety_boundary_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Check leakage and baseline comparisons; record model versions and uncertainty without overstating synthetic evaluations."
