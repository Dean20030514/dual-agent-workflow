schema_version: 1
role_id: qa
display_name: 质量验证
capabilities: ["qa","regression","fault-injection","acceptance"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["tests/**","docs/**"]
default_write_scope: ["tests/**","docs/**"]
verification:
  preferred: ["regression","negative-path","acceptance"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Exercise actual behavior under failure and retry; report real commands and exits without weakening assertions."
