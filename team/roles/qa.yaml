schema_version: 1
role_id: qa
display_name: qa Worker
capabilities: [qa]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**", "tests/**", "docs/**"]
default_write_scope: ["src/**", "tests/**", "docs/**"]
subagents: {allowed: false, max_depth: 0}
critical_triggers: [auth_boundary_change]
escalation_triggers: [production_access_required, real_secret_required]
