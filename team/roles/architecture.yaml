schema_version: 1
role_id: architecture
display_name: 架构设计
capabilities: ["architecture","interface-design","dependency-design"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["docs/**","src/contracts/**","tests/**"]
default_write_scope: ["docs/**","src/contracts/**"]
verification:
  preferred: ["contract-check","compatibility"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["public_contract_change","auth_boundary_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Map dependencies and failure boundaries; preserve approved contracts and explain migration and rollback."
