schema_version: 1
role_id: database
display_name: 数据库工程
capabilities: ["database","sql","schema-migration","query-optimization"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["queries/**","migrations/**","src/**","tests/**","docs/**"]
default_write_scope: ["queries/**","migrations/**","src/**","tests/**"]
verification:
  preferred: ["query-plan","migration","integration"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["destructive_migration","data_ownership_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Inspect the actual schema; preserve constraints and transactions; distinguish local rehearsal from production deployment."
