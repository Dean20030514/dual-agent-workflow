schema_version: 1
role_id: integration
display_name: 集成工程
capabilities: ["integration","merge-conflict-resolution","glue-code","contract-alignment"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["docs/**","tests/**"]
default_write_scope: []
verification:
  preferred: ["targeted-regression","contract-check","full-regression"]
subagents: {allowed: false, max_depth: 0}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Resolve only conflict files and approved glue; preserve accepted goals, interfaces, acceptance criteria, and valid tests."
write_scope_policy:
  mode: conflict_files_plus_explicit_glue_scope
may_change_interfaces: false
may_change_acceptance: false
may_change_tests:
  allowed: true
  only_if: [integration_broke_valid_test, adaptation_to_approved_contract]
forbidden: [new_business_requirements, unapproved_public_contract_change, scope_expansion_without_decision]
escalate_if: [requires_business_decision, requires_new_architecture, invalidates_accepted_task]
