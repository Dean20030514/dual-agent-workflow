schema_version: 1
role_id: security
display_name: 安全工程
capabilities: ["security","threat-model","authorization","privacy"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","tests/**","docs/**"]
default_write_scope: ["src/**","tests/**","docs/**"]
verification:
  preferred: ["negative-security","authorization","dependency-audit"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["auth_boundary_change","secret_boundary_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Trace concrete trust boundaries and reachable counterexamples; do not access real secrets or production without approval."
