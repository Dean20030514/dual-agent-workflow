schema_version: 1
role_id: ux
display_name: 交互设计
capabilities: ["ux","user-flow","accessibility"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["docs/**","src/**","tests/**"]
default_write_scope: ["docs/**","src/**","tests/**"]
verification:
  preferred: ["flow-review","accessibility"]
subagents: {allowed: false, max_depth: 0}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Cover loading, empty, failure, retry, and recovery states; preserve keyboard access."
