schema_version: 1
role_id: ui
display_name: 界面实现
capabilities: ["ui","visual-system","responsive-layout"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","tests/**","assets/**","docs/**"]
default_write_scope: ["src/**","tests/**","assets/**"]
verification:
  preferred: ["visual-review","responsive","accessibility"]
subagents: {allowed: false, max_depth: 0}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Use the existing visual system; verify narrow layouts, long content, focus visibility, and contrast."
