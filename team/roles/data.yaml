schema_version: 1
role_id: data
display_name: 数据工程
capabilities: ["data","data-quality","pipeline","metric-definition"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","tests/**","docs/**","queries/**"]
default_write_scope: ["src/**","tests/**","docs/**","queries/**"]
verification:
  preferred: ["data-quality","reconciliation","pipeline"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["data_ownership_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Validate schema, missing values, duplicates, units, and provenance; preserve source data and reproducible metric definitions."
