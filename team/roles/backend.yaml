schema_version: 1
role_id: backend
display_name: 后端工程
capabilities: ["backend","api","auth","session","service-layer"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","tests/**","docs/**"]
default_write_scope: ["src/**","tests/**"]
verification:
  preferred: ["unit","integration","typecheck"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: ["auth_boundary_change","public_contract_change"]
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Enforce server authorization and validation; cover idempotency, transactions, retries, and client compatibility."
