schema_version: 1
role_id: generalist
display_name: 通用工程
capabilities: ["generalist","cross-module-fix","maintenance"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["src/**","tests/**","docs/**"]
default_write_scope: ["src/**","tests/**","docs/**"]
verification:
  preferred: ["unit","regression"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Trace the failing user path; verify failure recovery as well as the happy path."
