schema_version: 1
role_id: documentation
display_name: 文档工程
capabilities: ["documentation","quickstart","reference","examples"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["docs/**","README.md","tests/**"]
default_write_scope: ["docs/**","README.md"]
verification:
  preferred: ["link-check","example-validation","consistency"]
subagents: {allowed: false, max_depth: 0}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Document current observable behavior and usable commands; align examples with implemented contracts and explicit limitations."
