schema_version: 1
role_id: research
display_name: 技术研究
capabilities: ["research","source-evaluation","feasibility"]
default_permissions: {shell: true, network: false, secrets: false, production: false}
default_read_scope: ["docs/**","tests/**"]
default_write_scope: ["docs/**"]
verification:
  preferred: ["source-check","reproduction"]
subagents: {allowed: true, max_depth: 2}
critical_triggers: []
escalation_triggers: [production_access_required, real_secret_required, destructive_operation, mutually_exclusive_business_decision]
guidance:
  - "Separate measured facts, primary-source statements, and hypotheses; include reproducible evidence."
